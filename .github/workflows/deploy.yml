name: Deploy Feliciometro

on:
  push:
    branches:
      - principal

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del Feliciometro
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publicar Feliciometro
        id: deployment
        uses: actions/deploy-pages@v4
